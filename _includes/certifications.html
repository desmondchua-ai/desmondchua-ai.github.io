<div class="projects-inner">
  <div class="section-eyebrow">Certifications</div>

  <p class="cert-intro">
    Earned credentials and certifications, with more in progress.
  </p>

  <div class="cert-grid">
    <!-- Duplicate this <article> to add another certification -->
    <article class="cert-card">
      <img class="cert-logo"
           src="{{ "/assets/img/dp900.svg" | prepend: site.baseurl }}"
           alt="Microsoft Certified: Azure Data Fundamentals (DP-900) badge"
           width="90" height="90" />
      <div class="cert-info">
        <h3 class="cert-title">Microsoft Certified: Azure Data Fundamentals (DP-900)</h3>
        <p class="cert-issuer">Microsoft</p>
        <div class="status-badge status-earned">
          <span class="status-dot"></span> Earned
        </div>
      </div>
    </article>
  </div>
</div>
